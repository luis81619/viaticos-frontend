<div class="space-y-4">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold text-gray-800">Catálogo de Vehículos</h1>

    <button
      title="Agregar nuevo vehículo"
      class="flex h-11 w-11 items-center justify-center rounded-lg bg-green-600 text-white shadow-sm transition hover:bg-green-700"
      (click)="openVehiculoModal()"
    >
      <span class="relative -top-[1px] text-2xl font-light"> + </span>
    </button>
  </div>

  <app-ui-pagination
    [totalItems]="store.totalRecords()"
    [page]="store.currentPage()"
    [pageSize]="store.pageSize()"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />

  <app-ui-data-table
    [columns]="columns()"
    [data]="store.vehiculos()"
    [actions]="actions"
    [loading]="store.isLoading()"
    (actionClick)="onAction($event)"
    (filterChange)="onFilterChange($event)"
  />

  <app-ui-pagination
    [totalItems]="store.totalRecords()"
    [page]="store.currentPage()"
    [pageSize]="store.pageSize()"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />
</div>

<ng-template #statusTemplate let-row>
  <app-ui-badge
    [label]="row.status ? 'Activo' : 'Inactivo'"
    [variant]="row.status ? 'success' : 'danger'"
  />
</ng-template>

<ng-template #tipoTemplate let-row>
  {{ getVehiculoTipoLabel(row.tipo) }}
</ng-template>

<app-vehiculo-form-modal
  [isOpen]="isVehiculoModalOpen()"
  [vehiculo]="selectedVehiculo()"
  [isSaving]="store.isSaving()"
  (close)="closeVehiculoModal()"
  (saved)="onVehiculoSaved($event)"
/>
