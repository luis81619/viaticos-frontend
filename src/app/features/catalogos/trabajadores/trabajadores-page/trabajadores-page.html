<section class="space-y-6">
  <header
    class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
  >
    <div>
      <h1 class="text-2xl font-semibold text-gray-900">
        Trabajadores
      </h1>

      <p class="mt-1 text-sm text-gray-600">
        Consulta de trabajadores sincronizados con RH.
      </p>
    </div>

    <div class="group relative">
      <app-ui-button
        variant="primary"
        [disabled]="store.isSyncing()"
        (click)="confirmSync()"
      >
        <lucide-icon
          [img]="RefreshCwIcon"
          class="h-5 w-5"
        />

        Sincronizar
      </app-ui-button>

      <div
        class="pointer-events-none absolute right-0 top-full z-20 mt-2 whitespace-nowrap rounded-md bg-gray-900 px-3 py-1.5 text-xs text-white opacity-0 shadow-lg transition-opacity group-hover:opacity-100"
      >
        Actualizar trabajadores desde RH
      </div>
    </div>
  </header>

  <div class="rounded-xl bg-white p-5 shadow-sm">
    <app-ui-pagination
      [totalItems]="store.totalRecords()"
      [page]="store.currentPage()"
      [pageSize]="store.pageSize()"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
    />

    <app-ui-data-table
      [columns]="columns()"
      [data]="store.trabajadores()"
      [loading]="store.isLoading()"
      (filterChange)="onFilterChange($event)"
    />

    <app-ui-pagination
      [totalItems]="store.totalRecords()"
      [page]="store.currentPage()"
      [pageSize]="store.pageSize()"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
    />
  </div>

  <ng-template #nombreCompletoTemplate let-row>
    {{ row.apellidoPaterno }} {{ row.apellidoMaterno }} {{ row.nombre }}
  </ng-template>

  <app-ui-loading-overlay
    [visible]="store.isSyncing()"
    message="Sincronizando trabajadores con RH..."
  />
</section>
