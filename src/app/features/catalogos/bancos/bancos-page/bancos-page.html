<div class="space-y-4">

  <div class="flex items-center justify-between">

    <h1 class="text-2xl font-semibold text-gray-800">
      Catálogo de Bancos
    </h1>

    <button
      title="Agregar nuevo banco"
      class="flex h-11 w-11 items-center justify-center rounded-lg bg-green-600 text-white shadow-sm transition hover:bg-green-700"
      (click)="openBankModal()"
    >
      <span class="relative -top-[1px] text-2xl font-light">
        +
      </span>
    </button>

  </div>

  <app-ui-pagination
    [totalItems]="store.totalRecords()"
    [page]="store.currentPage()"
    [pageSize]="store.pageSize()"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />

  <app-ui-data-table
    [columns]="columns()"
    [data]="store.bancos()"
    [actions]="actions"
    [loading]="store.isLoading()"
    (actionClick)="onAction($event)"
    (filterChange)="onFilterChange($event)"
  />

  <ng-template
    #statusTemplate
    let-row
  >

    <app-ui-badge
      [label]="row.isActive ? 'Activo' : 'Inactivo'"
      [variant]="row.isActive ? 'success' : 'danger'"
    />

  </ng-template>

  <app-ui-pagination
    [totalItems]="store.totalRecords()"
    [page]="store.currentPage()"
    [pageSize]="store.pageSize()"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />

</div>

<ng-template
  #statusTemplate
  let-row
>
  <app-ui-badge
    [label]="row.isActive ? 'Activo' : 'Inactivo'"
    [variant]="row.isActive ? 'success' : 'danger'"
  />
</ng-template>


<app-banco-form-modal
  [isOpen]="isBankModalOpen()"
  [banco]="selectedBanco()"
  [isSaving]="store.isSaving()"
  (close)="closeBankModal()"
  (saved)="onBankSaved($event)"
/>
