<app-ui-modal
  [isOpen]="isOpen()"
  [title]="municipio() ? 'Editar Municipio' : 'Asignar Municipio'"
  (close)="onCancel()"
  [size]="'md'"
>
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    autocomplete="off"
    class="flex flex-col gap-4"
  >
    <app-ui-form-select-input
      label="Estado"
      placeholder="Seleccione un estado"
      [control]="form.controls.estadoId"
      [options]="estadoOptions()"
    />

    <app-ui-form-select-input
      label="Municipio"
      placeholder="Seleccione un municipio"
      [control]="form.controls.municipioId"
      [options]="municipioOptions()"
    />

    <app-ui-form-select-input
      label="Zona"
      placeholder="Seleccione una zona"
      [control]="form.controls.zonaId"
      [options]="zonaOptions()"
    />

    <app-ui-form-text-input
      label="Región"
      placeholder="EJ. VALLE DE TOLUCA"
      [control]="form.controls.region"
    />

    <app-ui-form-footer
      [submitLabel]="municipio() ? 'ACTUALIZAR' : 'GUARDAR'"
      [loading]="isSaving()"
      [submitDisabled]="isSaving()"
      (cancel)="onCancel()"
    />
  </form>
</app-ui-modal>
