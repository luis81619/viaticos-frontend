<div class="space-y-4">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold text-gray-800">Catálogo de Municipios</h1>

    <button
      title="Asignar municipio"
      class="flex h-11 w-11 items-center justify-center rounded-lg bg-green-600 text-white shadow-sm transition hover:bg-green-700"
      (click)="openMunicipioModal()"
    >
      <span class="relative -top-[1px] text-2xl font-light"> + </span>
    </button>
  </div>

  <app-ui-pagination
    [totalItems]="store.totalRecords()"
    [page]="store.currentPage()"
    [pageSize]="store.pageSize()"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />

  <app-ui-data-table
    [columns]="columns()"
    [data]="store.municipios()"
    [actions]="actions"
    [loading]="store.isLoading()"
    (actionClick)="onAction($event)"
    (filterChange)="onFilterChange($event)"
  />
</div>

<ng-template #estadoTemplate let-row>
  {{ row.estado?.nombre }}
</ng-template>

<ng-template #zonaTemplate let-row>
  {{ row.zona?.nombre }}
</ng-template>

<app-municipio-form-modal
  [isOpen]="isMunicipioModalOpen()"
  [municipio]="selectedMunicipio()"
  [isSaving]="store.isSaving()"
  (close)="closeMunicipioModal()"
  (saved)="onMunicipioSaved($event)"
/>
