<div class="space-y-1.5">

  <div class="relative">

    <input
      type="text"
      placeholder=" "
      autocomplete="off"
      [value]="texto()"
      class="peer w-full rounded-lg border bg-white px-3 pb-2 pt-6 text-sm outline-none transition focus:border-green-500 focus:ring-2 focus:ring-green-100"
      [class.border-red-300]="showError()"
      [class.border-gray-300]="!showError()"
      (input)="onInput($event)"
      (focus)="abierto.set(true)"
      (blur)="onBlur()"
    />

    <label
      class="pointer-events-none absolute left-3 top-2 text-xs text-gray-500 transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-sm peer-focus:top-2 peer-focus:text-xs peer-focus:text-green-600"
    >
      {{ finalLabel() }}
    </label>

    @if (mostrarOpciones()) {
      <ul
        class="absolute z-30 mt-1 max-h-60 w-full overflow-auto rounded-lg border border-gray-200 bg-white py-1 shadow-lg"
      >
        @if (loading()) {
          <li class="px-3 py-2 text-sm text-gray-500">Buscando...</li>
        } @else {
          @for (option of options(); track $index) {
            <li>
              <!-- mousedown evita que el blur del input cierre la lista antes del clic -->
              <button
                type="button"
                class="w-full px-3 py-2 text-left text-sm text-gray-700 hover:bg-green-50"
                (mousedown)="$event.preventDefault()"
                (click)="seleccionar(option)"
              >
                {{ option.label }}
              </button>
            </li>
          } @empty {
            <li class="px-3 py-2 text-sm text-gray-500">Sin resultados.</li>
          }
        }
      </ul>
    }

  </div>

  @if (showError()) {
    <p class="text-xs text-red-600">
      Escribe y elige una opción de la lista.
    </p>
  }

</div>
