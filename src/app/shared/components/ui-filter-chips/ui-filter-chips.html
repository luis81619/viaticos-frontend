<div class="flex flex-wrap gap-2">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="inline-flex items-center gap-1.5 rounded-lg border px-3 py-1.5 text-sm transition"
      [class.border-gray-900]="option.value === selected()"
      [class.bg-gray-900]="option.value === selected()"
      [class.text-white]="option.value === selected()"
      [class.border-orange-300]="option.value !== selected() && option.destacado"
      [class.bg-orange-50]="option.value !== selected() && option.destacado"
      [class.text-orange-700]="option.value !== selected() && option.destacado"
      [class.border-gray-200]="option.value !== selected() && !option.destacado"
      [class.bg-white]="option.value !== selected() && !option.destacado"
      [class.text-gray-700]="option.value !== selected() && !option.destacado"
      [class.hover:bg-gray-50]="option.value !== selected() && !option.destacado"
      (click)="selectedChange.emit(option.value)"
    >
      <span class="font-semibold">{{ option.count }}</span>
      {{ option.label }}
    </button>
  }
</div>
