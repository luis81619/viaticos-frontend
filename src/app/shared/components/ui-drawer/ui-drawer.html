@if (isOpen()) {

  <div class="fixed inset-0 z-50 flex justify-end bg-black/40" (click)="close.emit()">

    <aside
      class="flex h-full w-full max-w-2xl flex-col bg-white shadow-xl"
      (click)="$event.stopPropagation()"
    >

      <header class="flex items-start justify-between gap-4 border-b border-gray-200 px-5 py-4">

        <div class="min-w-0">
          <ng-content select="[drawerHeader]" />
        </div>

        <button
          type="button"
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md border border-gray-200 text-gray-500 transition hover:bg-gray-100 hover:text-gray-700"
          (click)="close.emit()"
        >
          ×
        </button>

      </header>

      <div class="flex-1 overflow-y-auto px-5 py-4">
        <ng-content />
      </div>

      <footer class="border-t border-gray-200 px-5 py-3">
        <ng-content select="[drawerFooter]" />
      </footer>

    </aside>

  </div>

}
