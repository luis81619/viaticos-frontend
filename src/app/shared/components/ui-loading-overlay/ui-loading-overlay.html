@if (visible()) {
  <div
    class="fixed inset-0 z-[70] flex items-center justify-center bg-gray-900/30 backdrop-blur-[1px]"
    role="status"
    aria-live="polite"
  >
    <div
      class="flex min-w-56 flex-col items-center gap-4 rounded-xl bg-white px-8 py-6 shadow-2xl"
    >
      <div
        class="h-10 w-10 animate-spin rounded-full border-4 border-green-200 border-t-green-600"
      ></div>

      <p class="text-sm font-medium text-gray-700">
        {{ message() }}
      </p>

      <p class="text-xs text-gray-500">
        Por favor, espere un momento.
      </p>
    </div>
  </div>
}
