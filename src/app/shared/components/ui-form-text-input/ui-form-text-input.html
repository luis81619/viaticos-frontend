<div class="space-y-1.5">

  <div class="relative">

    <input
      appUppercase
      [type]="type()"
      placeholder=" "
      [formControl]="control()"
      class="peer w-full rounded-lg border bg-white px-3 pb-2 pt-6 text-sm outline-none transition focus:border-green-500 focus:ring-2 focus:ring-green-100"
      [class.border-red-300]="showError()"
      [class.border-gray-300]="!showError()"
    />

    <label
      class="pointer-events-none absolute left-3 top-2 text-xs text-gray-500 transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-sm peer-focus:top-2 peer-focus:text-xs peer-focus:text-green-600"
    >
      {{ finalLabel() }}
    </label>

  </div>

  @if (showError()) {
    <p class="text-xs text-red-600">
      {{ getErrorMessage() }}
    </p>
  }

</div>
